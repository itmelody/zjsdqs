<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浙江省城市桥隧安全监管</title>
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: 'd5af3b6c6ddfb4d8e7a2b91f82c0bf45'
      }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=11ff1e3bd0d19646144e5c8e116d486c"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 诊断：3秒后检查页面上的遮挡元素
      setTimeout(function() {
        var header = document.querySelector('.cockpit-header');
        if (header) {
          var rect = header.getBoundingClientRect();
          var centerX = rect.left + rect.width / 2;
          var centerY = rect.top + rect.height / 2;
          var el = document.elementFromPoint(centerX, centerY);
          console.log('[DIAG] Header center element:', el ? el.tagName + '.' + el.className : 'null');
          if (el !== header && !header.contains(el)) {
            console.log('[DIAG] BLOCKED! Element blocking header:', el.outerHTML.substring(0, 200));
          }
        }
        // 检查全屏覆盖层
        var allEls = document.querySelectorAll('body > *');
        allEls.forEach(function(e) {
          var s = getComputedStyle(e);
          if (s.position === 'fixed' || s.position === 'absolute') {
            var r = e.getBoundingClientRect();
            if (r.width >= window.innerWidth * 0.9 && r.height >= window.innerHeight * 0.9) {
              console.log('[DIAG] Full-screen overlay found:', e.tagName + '.' + e.className, 'z-index:', s.zIndex, 'pointer-events:', s.pointerEvents);
            }
          }
        });
      }, 5000);
    </script>
  </body>
</html>
